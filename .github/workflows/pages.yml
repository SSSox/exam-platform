# Publishes the web version to GitHub Pages: https://<owner>.github.io/<repository>/.
# The build embeds no banks (EXAM_CONTENT_DIR=none): the page loads them from the addresses in content-sources.json.
name: Web version

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.signpath/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling one that is half deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Run the checks
        run: |
          npm ci --ignore-scripts
          npx tsc -p .
          npx vitest run

      - name: Build the page
        run: npm --prefix apps/ui run build
        env:
          EXAM_CONTENT_DIR: none

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
